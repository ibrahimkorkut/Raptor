[package]
name = "hyperdownload-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
hyperdownload-shared = { path = "../../crates/shared" }
hyperdownload-download-engine = { path = "../../crates/download-engine" }
hyperdownload-storage = { path = "../../crates/storage" }
hyperdownload-browser-bridge = { path = "../../crates/browser-bridge" }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wry = "0.57"
tao = "0.37"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
